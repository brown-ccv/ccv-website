name: Deploy Release App

on:
  push:
    branches:
      - main

env:
  gcp_project_id: ccv-website-next
  gcp_registry_url: us-central1-docker.pkg.dev
  gcp_artifact_registry: gcp-ccv-website
  image: ${{ github.event.repository.name }}-release
  SITE_URL: https://ccv.brown.edu

jobs:
  # Index writes are serialized across workflows. A pending index run may be
  # superseded by a newer one, which is safe because every run indexes the
  # latest content. Deploys are deliberately NOT in this group so a pending
  # release is never dropped.
  update-search-index:
    runs-on: ubuntu-latest
    concurrency:
      group: meilisearch-index
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build and Upload Search Index
        run: npm run search:index
        env:
          MEILISEARCH_HOST: ${{ secrets.MEILISEARCH_HOST }}
          MEILISEARCH_MASTER_KEY: ${{ secrets.MEILISEARCH_MASTER_KEY }}

  build-release-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.gcp_project_id }}
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          export_environment_variables: true
          create_credentials_file: true

      - uses: google-github-actions/setup-gcloud@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.gcp_registry_url }}
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker Auth
        shell: bash
        run: |
          gcloud auth configure-docker ${{ env.gcp_registry_url }}

      - uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ env.gcp_registry_url }}/${{ env.gcp_project_id }}/${{ env.gcp_artifact_registry }}/${{ env.image }}:latest
          build-args: |
            NEXT_PUBLIC_MEILISEARCH_HOST=${{ secrets.MEILISEARCH_HOST }}
            NEXT_PUBLIC_MEILISEARCH_SEARCH_KEY=${{ secrets.MEILISEARCH_SEARCH_KEY }}
            NEXT_PUBLIC_SITE_URL=${{ env.SITE_URL }}

      - uses: "google-github-actions/deploy-cloudrun@v2"
        id: "deploy"
        with:
          service: ${{ env.image }}
          project_id: ${{ env.gcp_project_id }}
          image: ${{ env.gcp_registry_url }}/${{ env.gcp_project_id }}/${{ env.gcp_artifact_registry }}/${{ env.image }}
          flags: >-
            --allow-unauthenticated
            --min-instances=1
            --max-instances=1
          env_vars: |
            NEXT_PUBLIC_MEILISEARCH_HOST=${{ secrets.MEILISEARCH_HOST }}
            NEXT_PUBLIC_MEILISEARCH_SEARCH_KEY=${{ secrets.MEILISEARCH_SEARCH_KEY }}
            NEXT_PUBLIC_SITE_URL=${{ env.SITE_URL }}

      - name: Show Deployment URL
        run: |
          echo "🚀 Deployed to: ${{ steps.deploy.outputs.url }}"
